services:
  - type: web
    name: attendx-backend
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false          # Set in Render dashboard
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL
        sync: false          # Set to your Vercel URL in dashboard
      - key: ALLOWED_ORIGINS
        sync: false          # Optional comma-separated list of allowed frontend origins
      - key: ML_SERVICE_URL
        sync: false          # URL of attendx-ml-service
      - key: ML_API_KEY
        sync: false          # Shared API key matching ml-service ML_API_KEY
      - key: CRON_TRIGGER_SECRET
        sync: false          # Optional dedicated secret for /admin-trigger/* endpoints
      - key: RATE_LIMIT_WINDOW_MS
        value: 900000
      - key: RATE_LIMIT_MAX
        value: 100
      - key: WEBAUTHN_RP_ID
        sync: false          # Your Vercel domain without https://
      - key: WEBAUTHN_ORIGIN
        sync: false          # Your full Vercel URL with https://
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
