services:
  - type: web
    name: attendx-ml
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: ENV
        value: production
      - key: ML_API_KEY
        sync: false          # Set shared secret matching backend ML_API_KEY
      - key: ALLOWED_ORIGINS
        sync: false          # Comma-separated backend/allowed origins
